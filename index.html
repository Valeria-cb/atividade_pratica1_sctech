    <section id="contato">
      <h2>Contato</h2>
      <p>Tem um projeto em mente? entre em contato.</p>

      <form action="">
        <label for="nome">Nome: </label>
        <input type="text" id="nome" name="nome" required> <br>

        <label for="email">Email: </label>
        <input type="email" id="email" name="email" required> <br>

        <label for="telefone">Telefone: </label>

        <label for="assunto">Assunto: </label>
        <select name="assunto" id="assunto">

          <option value="duvida">Duvida</option>
          <option value="outro">Outro</option>
        </select>

        <br>

        <label for="mensagem">Mensagem: </label>
        <textarea name="mensagem" id="mensagem" cols="30" rows="10" required></textarea><br>

        <input type="checkbox" id="inscricao" name="inscricao">
        <label for="inscricao">Deseja recer minha newsletter? Fique por dentro.</label>

        <br>

        <input type="submit" value="Enviar mensagem">

        <br>

        <input type="date">

        <br>

        <input type="color">



      </form>
